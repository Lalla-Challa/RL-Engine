[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "story-vault-mcp"
version = "2.0.3"
description = "MCP server for Story Vault — lets external AI clients (Claude Desktop, Cursor, Cline, Qwen Chat…) read and write your local encrypted writing vault."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "story-vault", "writing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
story-vault-mcp = "story_vault_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["story_vault_mcp"]

[tool.hatch.build.targets.sdist]
include = ["story_vault_mcp", "README.md"]
